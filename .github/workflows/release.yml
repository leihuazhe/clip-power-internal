name: Release

# 只在推版本 tag（比如 v0.2.0）时触发——平时往 main 推代码不会构建/发布任何东西，
# 避免 Releases 页面被日常 commit 刷成噪音，也避免每次 push 都白跑一次编译。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # 需要写权限才能创建 Release 并上传附件

jobs:
  build-and-release:
    runs-on: macos-15 # Apple Silicon runner，匹配本项目 arm64-only 的定位

    steps:
      - uses: actions/checkout@v4

      - name: Select an Xcode 26.x toolchain
        # 本机用 Xcode 26.6 生成/维护这个项目，XcodeGen 写出的 project.pbxproj
        # objectVersion 是 77——只有 Xcode 26.x 系列能读，macos-15 runner 默认的
        # Xcode 16.4 会报"future Xcode project file format"直接失败。
        # macos-15 镜像里同时装了好几个 26.x 小版本，挑其中最新的一个选中。
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Extract version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release configuration, ad-hoc signed)
        run: |
          xcodebuild \
            -project ClipPower.xcodeproj \
            -scheme ClipPower \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Build a .dmg (Apple Silicon only — see release notes)
        run: |
          version="${{ steps.version.outputs.version }}"
          app="build/Build/Products/Release/ClipPower.app"
          staging="dmg-staging"
          dmg="ClipPower-${version}-arm64.dmg"

          # 标准的"拖到 Applications"布局：一个只放 .app + Applications 软链接的
          # 临时目录，做成的 dmg 挂载后就是 Finder 里常见的安装界面。
          rm -rf "$staging"
          mkdir "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create -volname "ClipPower" -srcfolder "$staging" -ov -format UDZO "$dmg"
          mv "$dmg" "$GITHUB_WORKSPACE/"
          echo "dmg_name=$dmg" >> "$GITHUB_OUTPUT"
        id: dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ClipPower ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: ${{ steps.dmg.outputs.dmg_name }}
          body: |
            **Apple Silicon only** — Intel Macs are not supported.

            This build is ad-hoc signed, not notarized. On first launch, macOS will refuse
            to open it. Fix that once with:
            ```sh
            xattr -cr /Applications/ClipPower.app
            ```
            See the README for setup and usage.
