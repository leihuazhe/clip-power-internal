name: ClipPower
options:
  bundleIdPrefix: com.clippower
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # 默认值；发 Release 时 CI 会用 `MARKETING_VERSION=x.y.z` 命令行覆盖成 tag 里的版本号，
    # 见 .github/workflows/release.yml。Info.plist 用 $(MARKETING_VERSION) 引用它，
    # 而不是硬编码字符串，这样版本号只有一个来源（git tag），不用每次发布手动同步两处。
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 3.0.1

targets:
  ClipPower:
    type: application
    platform: macOS
    sources:
      - path: ClipPower
    settings:
      base:
        PRODUCT_NAME: ClipPower
        PRODUCT_BUNDLE_IDENTIFIER: com.clippower.app
        INFOPLIST_FILE: ClipPower/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
        product: KeyboardShortcuts

  ClipPowerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipPowerTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ClipPower
        embed: false

schemes:
  ClipPower:
    build:
      targets:
        ClipPower: all
        ClipPowerTests: [test]
    test:
      targets:
        - ClipPowerTests
    run:
      config: Debug
